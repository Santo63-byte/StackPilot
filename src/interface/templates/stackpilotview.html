<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>StackPilot</title>
	<link rel="stylesheet" href="/styles/boxbutton.css">
	<link rel="stylesheet" href="/styles/table.css">
    <link rel="stylesheet" href="/styles/addserver.css">
    <link rel="stylesheet" href="/styles/parentview.css">
    <link rel="stylesheet" href="/styles/session-drawer.css">
    <link rel="stylesheet" href="/styles/console-drawer.css">	<link rel="stylesheet" href="/styles/config-transfer.css"></head>
<body>
	<div class="main-layout">
		<div class="header-section">
			<div class="header-left-group">
				<button id="config-download-btn" class="config-header-btn" title="Download server config">
					<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
						<path d="M12 5v14M5 12l7 7 7-7"/>
					</svg>
				</button>
				<button id="config-upload-btn" class="config-header-btn" title="Upload server config">
					<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
						<path d="M12 19V5M5 12l7-7 7 7"/>
					</svg>
				</button>
			</div>
			<h1>Stack Pilot</h1>
			<div class="header-right-group">
				<button id="app-settings-btn" class="app-settings-btn" title="App Settings">&#9881;</button>
				<div id="proxy-start-btn-wrapper" style="display: none; align-items: center; gap: 6px;">
					<button id="proxy-start-btn" class="proxy-start-btn" title="Start Proxy Server">
						<span class="proxy-dot proxy-dot--red"></span>
					</button>
					<span id="proxy-error-icon" class="proxy-error-icon" style="display: none;"></span>
				</div>
				<select id="proxy-env-dropdown" class="proxy-env-dropdown" style="display: none;">
				</select>
				<box-button></box-button>
			</div>
		</div>
		<div class="center-content">
			<server-table></server-table>
		</div>
	</div>
	<div id="modal-overlay" class="modal-overlay" style="display: none;">
		<add-server-modal></add-server-modal>
	</div>

	<!-- ── App Settings Modal ─────────────────────────────────── -->
	<div id="settings-modal-overlay" class="modal-overlay" style="display: none;">
		<div class="settings-modal">
			<div class="settings-modal-header">
				<div class="settings-tabs">
					<button class="settings-tab active" data-tab="settings">Settings</button>
					<button class="settings-tab" data-tab="info">Info</button>
				</div>
				<button id="settings-modal-close" class="settings-modal-close" title="Close">&times;</button>
			</div>

			<!-- Settings Tab -->
			<div id="settings-tab-settings" class="settings-tab-panel">
				<div class="settings-modal-body">
					<div class="input_container">
						<label class="input_label">Refresh Interval</label>
						<select id="settings-refresh-interval" class="input_field settings-select">
							<option value="30">30 sec</option>
							<option value="60">1 min</option>
							<option value="300">5 min</option>
						</select>
					</div>
					<div class="input_container">
						<label class="input_label">Default Terminal</label>
						<select id="settings-default-terminal" class="input_field settings-select">
							<option value="StackPilot_Terminal">StackPilot Terminal</option>
							<option value="Windows_Terminal">Windows Terminal</option>
						</select>
					</div>
					<div class="settings-section-divider">
						<span>&#8212;&#8212; Proxy Settings &#8212;&#8212;</span>
					</div>
					<div class="input_container" id="settings-proxy-section">
						<label class="input_label">Proxy File Path</label>
						<div class="input_with_browse">
							<input id="settings-proxy-root-path" class="input_field" type="text" placeholder="/path/to/proxy/config" />
							<button type="button" class="browse-btn" id="settings-browse-btn" title="Browse folders">&#128193;</button>
						</div>
					</div>
				</div>
				<div class="settings-modal-footer">
					<button id="settings-save-btn" class="purchase--btn settings-save-btn">Save Settings</button>
				</div>
			</div>

			<!-- Info Tab -->
			<div id="settings-tab-info" class="settings-tab-panel" style="display: none;">
				<div class="settings-info-body">
					<img src="/assets/stackpilot.png" alt="StackPilot" class="settings-info-logo" />
					<div class="settings-info-version" id="settings-info-version">v—</div>
				</div>
			</div>
		</div>
	</div>

	<!-- ── Session Drawer ─────────────────────────────────────── -->
	<!-- Toggle button: fixed to the left edge, vertically centred -->
	<button id="session-drawer-toggle" class="session-drawer-toggle" title="Sessions">
		<span class="bar"></span>
		<span class="bar"></span>
		<span class="bar"></span>
	</button>

	<!-- Backdrop (closes drawer when clicked) -->
	<div id="session-drawer-backdrop" class="session-drawer-backdrop"></div>

	<!-- Drawer panel -->
	<div id="session-drawer" class="session-drawer">
		<div class="session-drawer-header">
			<h2>Sessions</h2>
			<div class="session-drawer-header-actions">
				<button id="session-add-btn" class="session-add-btn" title="Add session">+</button>
				<button id="session-drawer-close" class="session-drawer-close-btn" title="Close">&times;</button>
			</div>
		</div>

		<!-- Inline add form (hidden by default) -->
		<div id="session-add-form" class="session-add-form">
			<input id="session-add-input" type="text" placeholder="Session name…" maxlength="80" />
			<button id="session-add-confirm" class="btn-confirm">Add</button>
			<button id="session-add-cancel" class="btn-cancel">Cancel</button>
		</div>

		<!-- Session list -->
		<div id="session-drawer-list" class="session-drawer-list">
			<div class="session-drawer-empty">Open the drawer to load sessions.</div>
		</div>
	</div>
	<!-- ── Upload Config Modal ──────────────────────────────────────── -->
	<div id="upload-config-overlay" class="upload-config-overlay" style="display:none;">
		<div class="upload-config-modal">
			<div class="upload-config-header">
				<span class="upload-config-title">Upload Server Config</span>
				<button id="upload-config-close" class="upload-config-close" title="Close">&times;</button>
			</div>
			<div id="upload-drop-zone" class="upload-drop-zone">
				<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
					<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
					<polyline points="17 8 12 3 7 8"/>
					<line x1="12" y1="3" x2="12" y2="15"/>
				</svg>
				<p class="upload-drop-hint">Drag &amp; drop your <strong>JSON</strong> file here</p>
				<p class="upload-drop-sub">or</p>
				<label class="upload-browse-label" for="upload-file-input">Browse file</label>
				<input id="upload-file-input" type="file" accept=".json,application/json" style="display:none;" />
				<p id="upload-selected-name" class="upload-selected-name"></p>
			</div>
			<div class="upload-config-footer">
				<button id="upload-config-confirm-btn" class="upload-config-confirm-btn" disabled>Upload &amp; Override</button>
			</div>
			<p id="upload-config-status" class="upload-config-status"></p>
		</div>
	</div>

	<script src="/static/config.js"></script>
	<script type="module">
        import '/static/app.js';
	</script>
	<script src="/static/config-transfer.js"></script>

	<!-- ── Console Drawer (right side) ───────────────────────────────── -->
	<!-- Toggle button fixed to the right edge -->
	<button id="console-drawer-toggle" class="console-drawer-toggle" title="Console">
		<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
			<polyline points="4 17 10 11 4 5"></polyline>
			<line x1="12" y1="19" x2="20" y2="19"></line>
		</svg>
	</button>

	<!-- Backdrop -->
	<div id="console-drawer-backdrop" class="console-drawer-backdrop"></div>

	<!-- Drawer panel -->
	<div id="console-drawer" class="console-drawer">
		<div class="console-drawer-header">
			<div class="console-drawer-header-title">
				<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
					<polyline points="4 17 10 11 4 5"></polyline>
					<line x1="12" y1="19" x2="20" y2="19"></line>
				</svg>
				Console
			</div>
			<div class="kill-port-widget">
				<input id="kill-port-input" class="kill-port-input" type="text" inputmode="numeric" maxlength="6" placeholder="Port" title="Enter port number (up to 6 digits)">
				<button id="kill-port-btn" class="kill-port-btn">Kill-Port</button>
				<button id="open-terminal-btn" class="open-terminal-btn">Open Advanced Terminal</button>
			</div>
			<button id="console-drawer-close" class="console-drawer-close-btn" title="Close">&times;</button>
		</div>

		<!-- Tab bar — horizontal scroll when many tabs -->
		<div id="console-tab-bar" class="console-tab-bar"></div>

		<!-- Log panels injected here dynamically -->
		<div id="console-output-area" class="console-output-area"></div>
	</div>
</body>
</html>
