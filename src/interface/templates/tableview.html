<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StackPilot</title>
    <link rel="stylesheet" href="../styles/table.css">
</head>
<body>
    <div class="container">
        <!-- Batch start bar: shown when ≥2 servers are checked -->
        <div id="batch-start-bar" class="batch-start-bar" style="display:none;">
            <span id="batch-selected-count" class="batch-count">0 selected</span>
            <button id="batch-start-btn" class="batch-start-btn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                    <polygon points="5,3 19,12 5,21"></polygon>
                </svg>
                Start Selected
            </button>
            <button id="batch-move-btn" class="batch-move-btn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14M12 5l7 7-7 7"/>
                </svg>
                Move To
            </button>
            <button id="batch-copy-btn" class="batch-copy-btn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
                Copy To
            </button>
            <button id="batch-delete-btn" class="batch-delete-btn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    <line x1="10" y1="11" x2="10" y2="17"></line>
                    <line x1="14" y1="11" x2="14" y2="17"></line>
                </svg>
                Delete Selected
            </button>
        </div>
        <div class="table-wrapper">
            <div class="table-toolbar">
                <div id="current-session-label" class="current-session-label" style="display:none;" title="Click to switch session">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 6h18M3 12h18M3 18h18"/>
                    </svg>
                    <span id="current-session-name-text"></span>
                </div>
                <button id="refresh-table-btn" class="refresh-table-btn" title="Refresh servers list">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="23 4 23 10 17 10"/>
                        <polyline points="1 20 1 14 7 14"/>
                        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                    </svg>
                </button>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th class="checkbox-col">
                                <input type="checkbox" id="select-all-checkbox" title="Select all">
                            </th>
                            <th>Server Name</th>
                            <th>Root Path</th>
                            <th>Command</th>
                            <th>Git Branch</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="serverTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</body>
</html>
